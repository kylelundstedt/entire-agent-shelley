name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install fixture dependencies
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Compile and test
        run: make test
